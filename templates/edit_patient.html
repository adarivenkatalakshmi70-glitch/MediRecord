{% extends "base.html" %}
{% block title %}Edit Patient | MediRecord{% endblock %}
{% block content %}
<nav class="breadcrumb-nav mb-3">Dashboard → Patients → {{ patient.patient_id }} → Edit</nav>
<div class="card">
    <div class="card-body">
        <h1 class="h4 mb-4">Edit Patient</h1>
        <p class="text-muted">Patient ID cannot be changed: <strong>{{ patient.patient_id }}</strong></p>
        <form method="post" class="needs-validation" novalidate data-validate-patient="true" data-edit="true">
            <input type="hidden" name="patient_id" value="{{ patient.patient_id }}">
            <div class="row g-3">
                <div class="col-md-8">
                    <label class="form-label" for="name">Full Name</label>
                    <input class="form-control" id="name" name="name" required minlength="2" value="{{ form.name or '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="date_of_birth">Date of Birth</label>
                    <input class="form-control" id="date_of_birth" name="date_of_birth" type="date" required value="{{ form.date_of_birth or '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="gender">Gender</label>
                    <select class="form-select" id="gender" name="gender" required>
                        {% for option in ['Male', 'Female', 'Other', 'Prefer not to say'] %}
                        <option value="{{ option }}" {% if form.gender == option %}selected{% endif %}>{{ option }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="phone">Phone</label>
                    <input class="form-control" id="phone" name="phone" required value="{{ form.phone or '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="blood_group">Blood Group</label>
                    <select class="form-select" id="blood_group" name="blood_group">
                        <option value="">Select</option>
                        {% for option in ['A+', 'A-', 'B+', 'B-', 'AB+', 'AB-', 'O+', 'O-'] %}
                        <option value="{{ option }}" {% if form.blood_group == option %}selected{% endif %}>{{ option }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="emergency_contact">Emergency Contact</label>
                    <input class="form-control" id="emergency_contact" name="emergency_contact" value="{{ form.emergency_contact or '' }}">
                </div>
                <div class="col-12">
                    <label class="form-label" for="address">Address</label>
                    <textarea class="form-control" id="address" name="address" rows="2">{{ form.address or '' }}</textarea>
                </div>
            </div>
            <button class="btn btn-primary mt-4" type="submit">SAVE CHANGES</button>
            <a class="btn btn-outline-secondary mt-4" href="{{ url_for('patient_details', patient_id=patient.patient_id) }}">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
