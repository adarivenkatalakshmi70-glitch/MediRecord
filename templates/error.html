{% extends "base.html" %}
{% block title %}{{ code }} | MediRecord{% endblock %}
{% block content %}
<div class="card">
    <div class="card-body text-center py-5">
        <h1 class="h3">{{ code }}</h1>
        <p class="text-muted">{{ message }}</p>
        <a class="btn btn-primary" href="{{ url_for('dashboard') if session.get('user_id') else url_for('login') }}">Go back</a>
    </div>
</div>
{% endblock %}
