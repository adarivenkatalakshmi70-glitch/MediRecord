{% extends "base.html" %}
{% block title %}Add Visit | MediRecord{% endblock %}
{% block content %}
<nav class="breadcrumb-nav mb-3">Dashboard → Patients → {{ patient.patient_id }} → Add Visit</nav>
<div class="card">
    <div class="card-body">
        <h1 class="h4 mb-2">Add Visit</h1>
        <p class="text-muted">Patient: {{ patient.patient_id }} — {{ patient.name }}</p>
        <form method="post" class="needs-validation" novalidate>
            <div class="mb-3">
                <label class="form-label" for="doctor">Doctor</label>
                <input class="form-control" id="doctor" name="doctor" required placeholder="Dr. Kumar">
            </div>
            <div class="mb-3">
                <label class="form-label" for="visit_date">Visit Date</label>
                <input class="form-control" id="visit_date" name="visit_date" type="date" required value="{{ today }}">
            </div>
            <div class="mb-3">
                <label class="form-label" for="symptoms">Symptoms</label>
                <textarea class="form-control" id="symptoms" name="symptoms" rows="2"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label" for="diagnosis">Diagnosis</label>
                <input class="form-control" id="diagnosis" name="diagnosis">
            </div>
            <div class="mb-3">
                <label class="form-label" for="notes">Notes</label>
                <textarea class="form-control" id="notes" name="notes" rows="3"></textarea>
            </div>
            <button class="btn btn-primary" type="submit">SAVE VISIT</button>
            <a class="btn btn-outline-secondary" href="{{ url_for('patient_details', patient_id=patient.patient_id) }}">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
