{% extends "base.html" %}
{% block title %}Add History | MediRecord{% endblock %}
{% block content %}
<nav class="breadcrumb-nav mb-3">Dashboard → Patients → {{ patient.patient_id }} → Add History</nav>
<div class="card">
    <div class="card-body">
        <h1 class="h4 mb-2">Add Medical History</h1>
        <p class="text-muted">Patient: {{ patient.patient_id }} — {{ patient.name }}</p>
        <form method="post" class="needs-validation" novalidate>
            <div class="mb-3">
                <label class="form-label" for="condition">Condition</label>
                <input class="form-control" id="condition" name="condition" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="diagnosis">Diagnosis</label>
                <input class="form-control" id="diagnosis" name="diagnosis">
            </div>
            <div class="mb-3">
                <label class="form-label" for="notes">Notes</label>
                <textarea class="form-control" id="notes" name="notes" rows="4"></textarea>
            </div>
            <button class="btn btn-primary" type="submit">SAVE HISTORY</button>
            <a class="btn btn-outline-secondary" href="{{ url_for('patient_details', patient_id=patient.patient_id) }}">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
